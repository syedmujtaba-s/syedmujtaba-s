<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 64" width="900" height="64" role="img" aria-label="Model under training">
  <defs>
    <pattern id="haz" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="skewX(-35)">
      <rect width="40" height="40" fill="#ffd60a"/><rect width="20" height="40" fill="#111"/>
    </pattern>
    <clipPath id="bar"><rect x="64" y="16" width="772" height="32"/></clipPath>
    <g id="bot">
      <rect x="22" y="4" width="4" height="8" fill="#7df9ff"/><rect x="20" y="2" width="8" height="4" fill="#ff2e88"/>
      <rect x="6" y="12" width="36" height="26" rx="4" fill="#c9d1d9"/>
      <rect x="12" y="19" width="8" height="8" fill="#0d1117"><animate attributeName="height" values="8;8;1;8" keyTimes="0;0.9;0.95;1" dur="3s" repeatCount="indefinite"/></rect>
      <rect x="28" y="19" width="8" height="8" fill="#0d1117"><animate attributeName="height" values="8;8;1;8" keyTimes="0;0.9;0.95;1" dur="3s" repeatCount="indefinite"/></rect>
      <rect x="14" y="31" width="20" height="3" fill="#ff2e88"/>
      <rect x="10" y="40" width="28" height="16" rx="2" fill="#8b949e"/><rect x="2" y="42" width="6" height="12" fill="#8b949e"/><rect x="40" y="42" width="6" height="12" fill="#8b949e"/>
    </g>
  </defs>
  <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="0.7s" repeatCount="indefinite"/><use xlink:href="#bot" href="#bot"/></g>
  <g><animateTransform attributeName="transform" type="translate" values="0 -4;0 0;0 -4" dur="0.7s" repeatCount="indefinite"/><use xlink:href="#bot" href="#bot" x="852"/></g>
  <g clip-path="url(#bar)">
    <rect x="-40" y="16" width="960" height="32" fill="url(#haz)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="40 0" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="64" y="16" width="772" height="32" fill="none" stroke="#111" stroke-width="2"/>
  <rect x="310" y="12" width="280" height="40" fill="#ffd60a" stroke="#111" stroke-width="3"/>
  <text x="450" y="39" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="19" fill="#111">MODEL UNDER TRAINING</text>
</svg>
