<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Syed Mujtaba Shah">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0221"/><stop offset="1" stop-color="#2b0a4a"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#ff2e88"/></linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7df9ff"/><stop offset="0.55" stop-color="#ffffff"/><stop offset="1" stop-color="#ff5fd2"/></linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="floor"><rect x="0" y="170" width="900" height="90"/></clipPath>
    <clipPath id="type"><rect x="150" y="128" height="30" width="0"><animate attributeName="width" values="0;600;600;0" keyTimes="0;0.45;0.92;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <rect width="900" height="260" fill="url(#sky)"/>
  <g fill="#fff">
    <circle cx="60" cy="30" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="62" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="22" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="34" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="58" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="20" r="1.7"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>
  <circle cx="450" cy="170" r="74" fill="url(#sun)" opacity="0.9"/>
  <rect x="0" y="170" width="900" height="90" fill="#12032b"/>
  <g clip-path="url(#floor)" stroke="#ff2e88" stroke-width="1.4" opacity="0.85">
    <path d="M450 170L-500 260M450 170L-250 260M450 170L-60 260M450 170L110 260M450 170L250 260M450 170L360 260M450 170L450 260M450 170L540 260M450 170L650 260M450 170L790 260M450 170L960 260M450 170L1150 260M450 170L1400 260"/>
    <line x1="0" x2="900" y1="170" y2="170"><animate attributeName="y1" values="170;260" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y2" values="170;260" dur="2.4s" repeatCount="indefinite"/></line>
    <line x1="0" x2="900" y1="170" y2="170"><animate attributeName="y1" values="170;260" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/><animate attributeName="y2" values="170;260" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/></line>
    <line x1="0" x2="900" y1="170" y2="170"><animate attributeName="y1" values="170;260" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/><animate attributeName="y2" values="170;260" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/></line>
    <line x1="0" x2="900" y1="170" y2="170"><animate attributeName="y1" values="170;260" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/><animate attributeName="y2" values="170;260" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/></line>
    <line x1="0" x2="900" y1="171" y2="171" stroke="#7df9ff" stroke-width="2"/>
  </g>
  <g filter="url(#glow)">
    <text x="450" y="104" text-anchor="middle" font-family="Impact, 'Arial Black', 'Helvetica Neue', sans-serif" font-size="76" letter-spacing="4" fill="url(#txt)" stroke="#2a1fff" stroke-width="2" paint-order="stroke">SYED MUJTABA SHAH<animate attributeName="opacity" values="1;1;0.75;1;1;0.9;1" keyTimes="0;0.6;0.62;0.64;0.9;0.92;1" dur="5s" repeatCount="indefinite"/></text>
  </g>
  <g clip-path="url(#type)">
    <text x="450" y="150" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="20" font-weight="bold" fill="#7df9ff">&gt; building LLM agents, RAG and the backends under them</text>
  </g>
  <rect y="132" width="11" height="22" fill="#7df9ff">
    <animate attributeName="x" values="150;750;750;150" keyTimes="0;0.45;0.92;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>
</svg>
